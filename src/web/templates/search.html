{% extends "base.html" %}
{% block title %}Search · design-kb{% endblock %}
{% block main %}
<div class="search-bar">
  <form class="query" method="get" action="/search" hx-get="/search" hx-target="#search-body" hx-swap="outerHTML" hx-push-url="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input type="text" name="q" value="{{ q }}" aria-label="Search query" placeholder="Search for experience">
    <button class="button-accent" type="submit">Search</button>
  </form>
</div>
{% include "partials/search_body.html" %}
{% endblock %}
